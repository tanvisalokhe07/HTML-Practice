<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color: aqua;
            font-style: oblique;
            text-shadow: 0dvh;
            text-decoration: line-through ;
            font-weight: lighter;
            letter-spacing: 0px;
            border:3px dashed white;
            
        }
        body{
            background-color: brown;
            
            margin:10px;
        }
        .fixed-box{
            padding: 50px 50px ;
            margin: 60px ;
           border: 20px inset black;
           border-radius: 20px;
        }
        h2{
            border:20px solid white;
            padding: 60px;
            margin: 4em 1em;
        }
        :root{
            --color:blue;
            --text-style:bold;
        }
        h1{
            text-align: center;
            color: var(--color);

        }
        p{
            color:var(--color);
            font-weight:var(--text-style);
        }
        
    </style>
</head>
<body>
    <h1>Hi</h1>
    <h2 class="box">Hello</h2>
    <p class="box fixed-box">hello guys</p>
    
</body>
</html>
