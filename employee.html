<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
</head>
<body>
    <script>
        class Emp{
            id;
            #nm="xyz";
            #sal=100000;
            disp()
            {
                console.log("Employee id="+this.id);
                console.log("Employee name="+this.#nm);
                console.log("Employee salary="+this.#sal);
            }
        }
        let e1=new Emp();
        e1.id=1;
        e1.disp();
        let e2=new Emp();
        e2.id=2;
        e2.disp();
        let e3=new Emp();
        e3.id=3;
        e3.disp();

    </script>
    
</body>
