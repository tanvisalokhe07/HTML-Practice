<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Navbar</title>
    <style>
        *{
            margin: 0;
            padding:0;
            box-sizing: border-box;
        }
        nav{
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            padding: 25px 50px;
        }
        .Logo{
            color:white;
            font-size: 24px;
            font-weight: bold;
        }
        .links{
            display: flex;
            gap:50px;
            
        }
        .links a{
            color: white;
            text-decoration: none;
            font-size:18px;


        }
        .links a:hover{
            color:orange;
        }
        </style>
</head>
<body>
    <nav>
        <div class="Logo">My Website</div>
        <div class="links">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
        </div>
    </nav>
</body>
</html>
